<script>
// ---- Local storage shim ----
// Standalone version has no Claude backend, so this mimics the same
// get/set/list/delete interface using the browser's localStorage.
// Data lives only on THIS device/browser (that's the tradeoff for
// zero signup / zero backend).
window.storage = {
  async get(key, shared){
    const v = localStorage.getItem(key);
    if(v === null) throw new Error('Key not found: ' + key);
    return { key, value: v, shared: !!shared };
  },
  async set(key, value, shared){
    localStorage.setItem(key, value);
    return { key, value, shared: !!shared };
  },
  async delete(key, shared){
    localStorage.removeItem(key);
    return { key, deleted: true, shared: !!shared };
  },
  async list(prefix, shared){
    const keys = [];
    for(let i=0;i<localStorage.length;i++){
      const k = localStorage.key(i);
      if(!prefix || k.startsWith(prefix)) keys.push(k);
    }
    return { keys, prefix, shared: !!shared };
  }
};
</script>
<style>
  :root{
    --char:#1B1713;
    --char2:#241E18;
    --panel:#2B241D;
    --panel2:#33291F;
    --line:#43372A;
    --ember:#E28C2B;
    --ember-dim:#B8701F;
    --smoke:#F2E9DA;
    --smoke-dim:#B8AA97;
    --cost:#A85C4A;
    --profit:#7FA35C;
  }
  *{box-sizing:border-box;}
  body{margin:0;}
  #app{
    font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
    background:var(--char);
    color:var(--smoke);
    min-height:100vh;
    padding:18px 14px 60px;
    max-width:520px;
    margin:0 auto;
  }
  .brand{ display:flex; align-items:baseline; justify-content:space-between; margin-bottom:2px; }
  .brand h1{ font-family:'Fraunces',Georgia,serif; font-weight:600; font-size:24px; margin:0; color:var(--smoke); }
  .brand .flame{ color:var(--ember); }

  .tabs{ display:flex; gap:6px; margin:14px 0 18px; border-bottom:1px solid var(--line); }
  .tab{
    background:none; border:none; color:var(--smoke-dim); font-family:inherit;
    font-size:13.5px; font-weight:600; padding:8px 4px; cursor:pointer;
    border-bottom:2px solid transparent; margin-bottom:-1px;
  }
  .tab.active{ color:var(--ember); border-bottom-color:var(--ember); }

  .stats{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:20px; }
  .stat{ background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:12px 8px; text-align:center; }
  .stat .label{ font-size:11px; color:var(--smoke-dim); margin-bottom:4px; }
  .stat .val{ font-size:18px; font-weight:700; font-variant-numeric:tabular-nums; }
  .stat.cost .val{ color:var(--cost); }
  .stat.profit .val{ color:var(--profit); }

  .datepick{ background:none; border:none; color:var(--smoke-dim); font-size:13px; font-family:inherit; margin-bottom:14px; display:block; padding:0; }

  h2.section{ font-size:14px; font-weight:600; color:var(--smoke-dim); margin:22px 0 10px; }

  .products{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .prod{ background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:12px; text-align:left; color:var(--smoke); cursor:pointer; }
  .prod:active{ transform:scale(0.97); border-color:var(--ember-dim); }
  .prod .pname{ font-weight:600; font-size:14.5px; margin-bottom:2px; }
  .prod .pprice{ font-size:12.5px; color:var(--smoke-dim); }
  .prod .pmargin{ font-size:11px; color:var(--profit); margin-top:3px; }

  .manage-link{ display:inline-block; margin-top:10px; font-size:12px; color:var(--smoke-dim); text-decoration:underline; text-underline-offset:2px; cursor:pointer; background:none; border:none; padding:0; font-family:inherit; }

  .rowlist{ display:flex; flex-direction:column; gap:6px; }
  .rowitem{ display:flex; align-items:center; justify-content:space-between; background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:10px 12px; font-size:13.5px; }
  .rowitem .ri-main{ display:flex; flex-direction:column; }
  .rowitem .ri-name{ font-weight:600; }
  .rowitem .ri-sub{ color:var(--smoke-dim); font-size:11.5px; }
  .rowitem .ri-amt{ font-weight:700; font-variant-numeric:tabular-nums; }
  .rowitem .ri-del{ background:none;border:none;color:var(--smoke-dim); font-size:16px;padding:0 0 0 10px;cursor:pointer; }
  .rowitem .ri-return{ background:none;border:none;color:var(--ember); font-size:15px;padding:0 0 0 10px;cursor:pointer; }
  .empty{ color:var(--smoke-dim); font-size:13px; font-style:italic; padding:10px 2px; }

  .addbar{ display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; }
  .addbar input, .addbar select{ flex:1; background:var(--panel2); border:1px solid var(--line); border-radius:8px; color:var(--smoke); padding:10px; font-size:13.5px; font-family:inherit; min-width:0; }
  .addbar button{ background:var(--ember); color:var(--char); border:none; border-radius:8px; padding:0 16px; font-weight:700; font-size:13.5px; cursor:pointer; }

  .overlay{ position:fixed; inset:0; background:rgba(0,0,0,0.55); display:flex; align-items:flex-end; z-index:20; }
  .sheet{ background:var(--char2); border-top:1px solid var(--line); border-radius:16px 16px 0 0; width:100%; padding:20px 18px 26px; max-width:520px; margin:0 auto; max-height:80vh; overflow-y:auto; }
  .sheet h3{ margin:0 0 14px; font-size:16px; font-family:'Fraunces',serif; }
  .qtyrow{ display:flex; align-items:center; justify-content:center; gap:18px; margin:18px 0 20px; }
  .qtybtn{ width:44px;height:44px;border-radius:50%; background:var(--panel); border:1px solid var(--line); color:var(--smoke); font-size:20px; cursor:pointer; }
  .qtyval{ font-size:26px; font-weight:700; min-width:40px; text-align:center; }
  .sheetline{ display:flex; justify-content:space-between; font-size:13.5px; color:var(--smoke-dim); margin-bottom:4px; }
  .sheetline b{ color:var(--smoke); }
  .sheetbtns{ display:flex; gap:10px; margin-top:16px; }
  .sheetbtns button{ flex:1; padding:13px; border-radius:10px; border:none; font-weight:700; font-size:14px; cursor:pointer; font-family:inherit; }
  .btn-cancel{ background:var(--panel); color:var(--smoke-dim); border:1px solid var(--line) !important; }
  .btn-confirm{ background:var(--ember); color:var(--char); }

  .manage-field{ display:grid; grid-template-columns:1.3fr 0.85fr 0.85fr auto; gap:6px; align-items:center; margin-bottom:8px; }
  .manage-field input{ background:var(--panel2); border:1px solid var(--line); border-radius:7px; color:var(--smoke); padding:8px 6px; font-size:12.5px; font-family:inherit; width:100%; }
  .manage-field button{ background:none; border:none; color:var(--smoke-dim); font-size:16px; cursor:pointer; }
  .fieldlabels{ display:grid; grid-template-columns:1.3fr 0.85fr 0.85fr auto; gap:6px; font-size:10.5px; color:var(--smoke-dim); margin-bottom:6px; padding:0 2px; }
  .loading{ text-align:center; color:var(--smoke-dim); padding:40px 0; font-size:13px; }

  .histrow{ background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:12px; margin-bottom:8px; cursor:pointer; user-select:none; }
  .histrow .hd-top{ display:flex; justify-content:space-between; align-items:baseline; }
  .histrow .hd-date{ font-weight:700; font-size:14px; }
  .histrow .hd-profit{ font-weight:700; font-size:13.5px; }
  .histrow .hd-sub{ display:flex; gap:12px; font-size:11.5px; color:var(--smoke-dim); margin-top:5px; }
  .histrow .hd-note{ font-size:11.5px; color:var(--smoke-dim); margin-top:6px; font-style:italic; border-top:1px solid var(--line); padding-top:6px; }

  .dbrow{ display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid var(--line); font-size:13.5px; }
  .dbrow:last-child{ border-bottom:none; }
  .dbrow .dbname{ color:var(--smoke); }
  .dbrow .dbval{ font-weight:700; font-variant-numeric:tabular-nums; }
  .bignum{ text-align:center; margin-bottom:18px; }
  .bignum .val{ font-size:32px; font-weight:700; color:var(--ember); }
  .bignum .label{ font-size:12px; color:var(--smoke-dim); margin-top:2px; }
  .badge{ display:inline-block; background:var(--ember); color:var(--char); font-size:11px; font-weight:700; padding:2px 8px; border-radius:20px; margin-left:6px; }
</style>

<div id="app"><div class="loading">Firing up the grill…</div></div>

<script>
(function(){
  const DEFAULT_PRODUCTS = [
    { name:"Kuku", buy:500, sell:850 },
    { name:"Smokie", buy:25.45, sell:40 },
    { name:"Eggs", buy:15, sell:30 }
  ];
  const EXP_CATEGORIES = ["Stock","Transport","Personal","Other"];

  // Historical rows recovered from the user's spreadsheet (Daily Log tab)
  const HISTORY_SEED = [
    { date:"2026-07-16", kuku:400, smokie:800, eggs:0, stock:0, transport:150, personal:0, other:50,
      note:"Kuku 4pcs@100, Smokie 20pcs@40 (2 remained). Fare 150, Token 50" },
    { date:"2026-08-17", kuku:1370, smokie:880, eggs:0, stock:0, transport:100, personal:345, other:0,
      note:"Kuku 10+4pcs@100, Smokie 1kg@40. Transport 100, Breakfast 95, Kofi 250" },
    { date:"2026-08-18", kuku:1000, smokie:1280, eggs:0, stock:1800, transport:0, personal:0, other:0,
      note:"Kuku 11pcs, Smokie 32pcs. Restock: Kuku600, Smokie880, Makaa100, Nyanya100, Kitungu80, Dania40" },
    { date:"2026-08-19", kuku:2000, smokie:880, eggs:0, stock:0, transport:250, personal:0, other:0,
      note:"Kuku 21pcs@100, Smokie 22pcs@40. Fare 150, Fare(kuku) 100" },
    { date:"2026-08-22", kuku:1350, smokie:680, eggs:300, stock:700, transport:70, personal:60, other:0,
      note:"Kuku 1.5 chickens, Smokie 17pcs, Mayai 10pcs. Restock: Makaa100, Shee(ghee)600. Fare 70, Mkate 60" },
    { date:"2026-08-23", kuku:300, smokie:0, eggs:360, stock:965, transport:300, personal:85, other:50,
      note:"Kuku 3pcs@100, Mayai 12pcs@30. Restock: Kuku600, Mayai15pcs@15=225, Makaa100, Nyanya40. Fare 300, Mkate 85, K.j 50" },
    { date:"2026-08-28", kuku:550, smokie:280, eggs:225, stock:1320, transport:200, personal:0, other:0,
      note:"Smokie 0.5kg=280, Mayai 15pcs=225, Kuku=550. Restock: Makaa100, Nyanya40, Dania20, Shee1000, Spices160. Fare 200" },
    { date:"2026-08-29", kuku:600, smokie:260, eggs:225, stock:1270, transport:200, personal:0, other:0,
      note:"Smokie 0.5kg=260, Mayai 15pcs=225, Kuku=600. Restock: Makaa100, Nyanya40, Dania20, Shee950, Spices160. Fare 200" },
    { date:"2026-08-30", kuku:600, smokie:260, eggs:225, stock:710, transport:150, personal:65, other:60,
      note:"Smokie 0.5kg=260, Mayai 15pcs=225, Kuku=600. Restock: combined stock/spices 650, extra Mayai restock 60. Fare 150, Maji 60, Mkate 65" }
  ];
  const MARGIN_PCT = { Kuku:0.4, Smokie:0.325, Eggs:0.5 };

  let products = [];
  let day = { sales:[], expenses:[] };
  let currentDate = todayStr();
  let sheetState = null;
  let activeTab = 'log';

  function todayStr(){
    const d = new Date();
    return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
  }
  function fmtDateLabel(str){
    const [y,m,d] = str.split("-").map(Number);
    const dt = new Date(y, m-1, d);
    const isToday = str === todayStr();
    const label = dt.toLocaleDateString(undefined,{weekday:'short', month:'short', day:'numeric', year:'numeric'});
    return isToday ? "Today · "+label : label;
  }
  function monthLabel(str){
    const [y,m] = str.split("-").map(Number);
    return new Date(y, m-1, 1).toLocaleDateString(undefined,{month:'short', year:'numeric'});
  }
  function ksh(n){ return "Ksh " + Math.round(n).toLocaleString(); }
  function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function nowTime(){ return new Date().toLocaleTimeString(undefined,{hour:'2-digit',minute:'2-digit'}); }

  function showBanner(msg){
    let b = document.getElementById('errBanner');
    if(!b){
      b = document.createElement('div');
      b.id = 'errBanner';
      b.style.cssText = 'position:fixed;left:14px;right:14px;bottom:14px;max-width:492px;margin:0 auto;background:#5A2E22;color:#F2E9DA;border:1px solid #A85C4A;border-radius:10px;padding:10px 14px;font-size:12.5px;font-family:Inter,sans-serif;z-index:50;text-align:center;';
      document.body.appendChild(b);
    }
    b.textContent = msg;
    clearTimeout(b._t);
    b._t = setTimeout(()=>{ if(b) b.remove(); }, 3500);
  }

  // Retries a storage call a couple of times before giving up — the backend
  // occasionally hiccups with a transient bad response.
  // Single attempt, no retry loop — retrying storage calls can itself trip
  // a "message rate limit" on the backend, which is worse than one clean failure.
  async function withRetry(fn){
    return await fn();
  }

  async function loadProducts(){
    try{
      const r = await withRetry(()=> window.storage.get('products', false));
      products = r ? JSON.parse(r.value) : DEFAULT_PRODUCTS.slice();
      // One-time price refresh: if stored prices still match the old Kuku
      // defaults (600/1000), the user's new prices haven't been applied yet.
      const kuku = products.find(p=>p.name==="Kuku");
      if(kuku && kuku.buy===600 && kuku.sell===1000){
        products = DEFAULT_PRODUCTS.slice();
        try{ await withRetry(()=> window.storage.set('products', JSON.stringify(products), false)); }catch(e3){}
      }
    }catch(e){
      products = DEFAULT_PRODUCTS.slice();
      try{ await withRetry(()=> window.storage.set('products', JSON.stringify(products), false)); }
      catch(e2){ /* first-run seed failed — in-memory defaults still work for this session */ }
    }
  }
  async function saveProducts(){
    try{ await withRetry(()=> window.storage.set('products', JSON.stringify(products), false)); }
    catch(e){ console.error('save products failed', e); showBanner("Couldn't save products — check your connection and try again."); }
  }
  async function loadDay(dateStr){
    try{
      const r = await withRetry(()=> window.storage.get('day:'+dateStr, false));
      day = r ? JSON.parse(r.value) : { sales:[], expenses:[] };
    }catch(e){ day = { sales:[], expenses:[] }; }
  }
  async function saveDay(dateStr){
    try{ await withRetry(()=> window.storage.set('day:'+dateStr, JSON.stringify(day), false)); allDaysCache = null; }
    catch(e){ console.error('save day failed', e); showBanner("Couldn't save — check your connection and try again."); }
  }
  async function getAllDayKeys(){
    try{
      const r = await withRetry(()=> window.storage.list('day:', false));
      return r ? r.keys : [];
    }catch(e){ return []; }
  }
  let allDaysCache = null;
  async function loadAllDays(forceRefresh){
    if(allDaysCache && !forceRefresh) return allDaysCache;
    const keys = await getAllDayKeys();
    const out = [];
    for(const k of keys){
      try{
        const r = await window.storage.get(k, false);
        if(r) out.push({ date: k.replace('day:',''), data: JSON.parse(r.value) });
      }catch(e){}
    }
    out.sort((a,b)=> a.date < b.date ? 1 : -1);
    allDaysCache = out;
    return out;
  }

  async function seedHistoryIfNeeded(){
    try{
      const flag = await withRetry(()=> window.storage.get('importedHistorySeed', false));
      if(flag) return;
    }catch(e){ /* not set yet, proceed */ }
    for(const row of HISTORY_SEED){
      let existing = null;
      try{ const r = await window.storage.get('day:'+row.date, false); existing = r ? JSON.parse(r.value) : null; }catch(e){}
      if(existing) continue; // don't clobber a day the user already logged
      const sales = [];
      if(row.kuku)   sales.push({ name:"Kuku",   qty:null, revenue:row.kuku,   cost:Math.round(row.kuku*(1-MARGIN_PCT.Kuku)),   time:"", imported:true });
      if(row.smokie) sales.push({ name:"Smokie", qty:null, revenue:row.smokie, cost:Math.round(row.smokie*(1-MARGIN_PCT.Smokie)), time:"", imported:true });
      if(row.eggs)   sales.push({ name:"Eggs",   qty:null, revenue:row.eggs,   cost:Math.round(row.eggs*(1-MARGIN_PCT.Eggs)),   time:"", imported:true });
      const expenses = [];
      if(row.stock)     expenses.push({ desc:"Stock",     category:"Stock",     amount:row.stock,     time:"" });
      if(row.transport) expenses.push({ desc:"Transport", category:"Transport", amount:row.transport, time:"" });
      if(row.personal)  expenses.push({ desc:"Personal",  category:"Personal",  amount:row.personal,  time:"" });
      if(row.other)     expenses.push({ desc:"Other",     category:"Other",     amount:row.other,     time:"" });
      const dayObj = { sales, expenses, note: row.note };
      try{ await window.storage.set('day:'+row.date, JSON.stringify(dayObj), false); }catch(e){}
    }
    try{ await window.storage.set('importedHistorySeed', 'true', false); }catch(e){}
  }

  function totals(d){
    const revenue = d.sales.reduce((s,x)=>s+x.revenue,0);
    const cost = d.sales.reduce((s,x)=>s+x.cost,0) + d.expenses.reduce((s,x)=>s+x.amount,0);
    const profit = revenue - cost;
    return { revenue, cost, profit };
  }

  function renderTabs(){
    return `
      <div class="tabs">
        <button class="tab ${activeTab==='log'?'active':''}" data-tab="log">Log</button>
        <button class="tab ${activeTab==='expenses'?'active':''}" data-tab="expenses">Expenses</button>
        <button class="tab ${activeTab==='history'?'active':''}" data-tab="history">History</button>
        <button class="tab ${activeTab==='dashboard'?'active':''}" data-tab="dashboard">Dashboard</button>
      </div>`;
  }

  function render(){
    const app = document.getElementById('app');
    let body = '';
    if(activeTab==='log') body = renderLogTab();
    else if(activeTab==='expenses') body = renderExpensesTab();
    else if(activeTab==='history') body = '<div id="histBody" class="loading">Loading history…</div>';
    else body = '<div id="dbBody" class="loading">Crunching the numbers…</div>';

    app.innerHTML = `
      <div class="brand"><h1>The Marinade <span class="flame">Spot</span></h1></div>
      ${renderTabs()}
      ${body}
    `;
    app.querySelectorAll('.tab').forEach(t=>{
      t.addEventListener('click', ()=>{ activeTab = t.dataset.tab; render(); });
    });

    if(activeTab==='log') wireLogTab();
    else if(activeTab==='expenses') wireExpensesTab();
    else if(activeTab==='history') renderHistoryTab();
    else renderDashboardTab();
  }

  function renderLogTab(){
    const t = totals(day);
    return `
      <select class="datepick" id="dateSel"></select>
      <div class="stats">
        <div class="stat rev"><div class="label">Revenue</div><div class="val">${ksh(t.revenue)}</div></div>
        <div class="stat cost"><div class="label">Cost</div><div class="val">${ksh(t.cost)}</div></div>
        <div class="stat profit"><div class="label">Profit</div><div class="val">${ksh(t.profit)}</div></div>
      </div>
      <h2 class="section">Log a sale</h2>
      <div class="products" id="prodGrid"></div>
      <button class="manage-link" id="manageBtn">Edit products &amp; prices</button>

      <h2 class="section">Today's sales</h2>
      <div class="rowlist" id="salesList"></div>
    `;
  }

  function renderExpensesTab(){
    const t = totals(day);
    return `
      <select class="datepick" id="dateSel"></select>
      <div class="stats">
        <div class="stat cost"><div class="label">Expenses today</div><div class="val">${ksh(day.expenses.reduce((s,x)=>s+x.amount,0))}</div></div>
        <div class="stat"><div class="label">Sales cost</div><div class="val">${ksh(day.sales.reduce((s,x)=>s+x.cost,0))}</div></div>
        <div class="stat profit"><div class="label">Profit today</div><div class="val">${ksh(t.profit)}</div></div>
      </div>
      <h2 class="section">Restock &amp; expenses</h2>
      <div class="rowlist" id="expList"></div>
      <div class="addbar">
        <input id="expDesc" placeholder="Note (e.g. bought smokies)" />
        <select id="expCat">${EXP_CATEGORIES.map(c=>`<option value="${c}">${c}</option>`).join('')}</select>
        <input id="expAmt" placeholder="Ksh" inputmode="numeric" style="max-width:80px;" />
        <button id="expAdd">Add</button>
      </div>
    `;
  }

  function wireExpensesTab(){
    const sel = document.getElementById('dateSel');
    for(let i=0;i<21;i++){
      const d = new Date();
      d.setDate(d.getDate()-i);
      const str = d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
      const opt = document.createElement('option');
      opt.value = str; opt.textContent = fmtDateLabel(str);
      if(str===currentDate) opt.selected = true;
      sel.appendChild(opt);
    }
    sel.addEventListener('change', async (e)=>{ currentDate = e.target.value; await loadDay(currentDate); render(); });

    const expList = document.getElementById('expList');
    if(day.expenses.length===0){
      expList.innerHTML = `<div class="empty">No restock or expenses logged yet.</div>`;
    }else{
      expList.innerHTML = '';
      day.expenses.slice().reverse().forEach((x)=>{
        const realIdx = day.expenses.indexOf(x);
        const row = document.createElement('div');
        row.className = 'rowitem';
        row.innerHTML = `
          <div class="ri-main">
            <div class="ri-name">${escapeHtml(x.desc)} <span style="color:var(--smoke-dim);font-weight:400;">· ${escapeHtml(x.category||'Other')}</span></div>
            <div class="ri-sub">${x.time||'—'}</div>
          </div>
          <div style="display:flex;align-items:center;">
            <div class="ri-amt" style="color:var(--cost)">-${ksh(x.amount)}</div>
            <button class="ri-del" data-i="${realIdx}">✕</button>
          </div>`;
        expList.appendChild(row);
      });
      expList.querySelectorAll('.ri-del').forEach(b=>{
        b.addEventListener('click', async (e)=>{
          const i = Number(e.target.dataset.i);
          day.expenses.splice(i,1);
          await saveDay(currentDate); render();
        });
      });
    }
    document.getElementById('expAdd').addEventListener('click', addExpense);
    document.getElementById('expAmt').addEventListener('keydown', (e)=>{ if(e.key==='Enter') addExpense(); });
  }

  function wireLogTab(){
    const sel = document.getElementById('dateSel');
    for(let i=0;i<21;i++){
      const d = new Date();
      d.setDate(d.getDate()-i);
      const str = d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
      const opt = document.createElement('option');
      opt.value = str; opt.textContent = fmtDateLabel(str);
      if(str===currentDate) opt.selected = true;
      sel.appendChild(opt);
    }
    sel.addEventListener('change', async (e)=>{ currentDate = e.target.value; await loadDay(currentDate); render(); });

    const grid = document.getElementById('prodGrid');
    products.forEach((p, idx)=>{
      const margin = p.sell - p.buy;
      const btn = document.createElement('button');
      btn.className = 'prod';
      btn.innerHTML = `<div class="pname">${escapeHtml(p.name)}</div><div class="pprice">${ksh(p.sell)} each</div><div class="pmargin">+${ksh(margin)} margin</div>`;
      btn.addEventListener('click', ()=> openSheet(idx));
      grid.appendChild(btn);
    });

    const salesList = document.getElementById('salesList');
    if(day.sales.length===0){
      salesList.innerHTML = `<div class="empty">No sales logged yet — tap a product above.</div>`;
    }else{
      salesList.innerHTML = '';
      day.sales.slice().reverse().forEach((s)=>{
        const realIdx = day.sales.indexOf(s);
        const row = document.createElement('div');
        row.className = 'rowitem';
        const qtyLabel = s.qty ? ` × ${Math.abs(s.qty)}` : '';
        const isReturn = s.revenue < 0;
        const remaining = s.qty ? (s.qty - (s.returnedQty||0)) : (s.returned ? 0 : 1);
        const canReturn = !isReturn && remaining > 0;
        const nameLine = isReturn
          ? `↩ Return: ${escapeHtml(s.name)}${qtyLabel}`
          : `${escapeHtml(s.name)}${qtyLabel}${s.imported?'<span class="badge">imported</span>':''}`;
        row.innerHTML = `
          <div class="ri-main">
            <div class="ri-name" style="${isReturn?'color:var(--cost);':''}">${nameLine}</div>
            <div class="ri-sub">${s.time||'—'}</div>
          </div>
          <div style="display:flex;align-items:center;">
            <div class="ri-amt" style="${isReturn?'color:var(--cost);':''}">${ksh(s.revenue)}</div>
            ${canReturn?`<button class="ri-return" data-i="${realIdx}" title="Return">↩</button>`:''}
            <button class="ri-del" data-i="${realIdx}">✕</button>
          </div>`;
        salesList.appendChild(row);
      });
      salesList.querySelectorAll('.ri-del').forEach(b=>{
        b.addEventListener('click', async (e)=>{
          const i = Number(e.target.dataset.i);
          day.sales.splice(i,1);
          await saveDay(currentDate); render();
        });
      });
      salesList.querySelectorAll('.ri-return').forEach(b=>{
        b.addEventListener('click', (e)=>{
          const i = Number(e.target.dataset.i);
          openReturnSheet(i);
        });
      });
    }

    document.getElementById('manageBtn').addEventListener('click', openManage);
  }

  async function addExpense(){
    const descEl = document.getElementById('expDesc');
    const catEl = document.getElementById('expCat');
    const amtEl = document.getElementById('expAmt');
    const desc = descEl.value.trim() || catEl.value;
    const category = catEl.value;
    const amount = parseFloat(amtEl.value);
    if(!amount || amount<=0) return;
    day.expenses.push({ desc, category, amount, time: nowTime() });
    await saveDay(currentDate);
    render();
  }

  function openSheet(idx){ sheetState = { idx, qty:1 }; renderSheet(); }
  function renderSheet(){
    const p = products[sheetState.idx];
    const qty = sheetState.qty;
    const revenue = p.sell*qty, cost = p.buy*qty, profit = revenue-cost;
    let overlay = document.getElementById('overlay');
    if(!overlay){
      overlay = document.createElement('div');
      overlay.id = 'overlay'; overlay.className = 'overlay';
      document.body.appendChild(overlay);
      overlay.addEventListener('click', (e)=>{ if(e.target===overlay) closeSheet(); });
    }
    overlay.innerHTML = `
      <div class="sheet">
        <h3>${escapeHtml(p.name)}</h3>
        <div class="qtyrow">
          <button class="qtybtn" id="qtyMinus">–</button>
          <div class="qtyval">${qty}</div>
          <button class="qtybtn" id="qtyPlus">+</button>
        </div>
        <div class="sheetline"><span>Revenue</span><b>${ksh(revenue)}</b></div>
        <div class="sheetline"><span>Cost</span><b>${ksh(cost)}</b></div>
        <div class="sheetline"><span>Profit</span><b style="color:var(--profit)">${ksh(profit)}</b></div>
        <div class="sheetbtns">
          <button class="btn-cancel" id="sheetCancel">Cancel</button>
          <button class="btn-confirm" id="sheetConfirm">Add sale</button>
        </div>
      </div>`;
    document.getElementById('qtyMinus').onclick = ()=>{ if(sheetState.qty>1){ sheetState.qty--; renderSheet(); } };
    document.getElementById('qtyPlus').onclick = ()=>{ sheetState.qty++; renderSheet(); };
    document.getElementById('sheetCancel').onclick = closeSheet;
    document.getElementById('sheetConfirm').onclick = confirmSale;
  }
  function closeSheet(){ const overlay = document.getElementById('overlay'); if(overlay) overlay.remove(); sheetState = null; }
  async function confirmSale(){
    const p = products[sheetState.idx]; const qty = sheetState.qty;
    day.sales.push({ name: p.name, qty, revenue: p.sell*qty, cost: p.buy*qty, time: nowTime(), returnedQty:0 });
    await saveDay(currentDate); closeSheet(); render();
  }

  let returnState = null;
  function openReturnSheet(saleIdx){
    const s = day.sales[saleIdx];
    const maxQty = s.qty ? (s.qty - (s.returnedQty||0)) : 1;
    returnState = { saleIdx, qty: 1, maxQty };
    renderReturnSheet();
  }
  function renderReturnSheet(){
    const s = day.sales[returnState.saleIdx];
    const qty = returnState.qty;
    const unitRevenue = s.qty ? s.revenue/s.qty : s.revenue;
    const unitCost = s.qty ? s.cost/s.qty : s.cost;
    const revenue = unitRevenue*qty, cost = unitCost*qty;
    let overlay = document.getElementById('overlay');
    if(!overlay){
      overlay = document.createElement('div');
      overlay.id = 'overlay'; overlay.className = 'overlay';
      document.body.appendChild(overlay);
      overlay.addEventListener('click', (e)=>{ if(e.target===overlay) closeReturnSheet(); });
    }
    const showStepper = !!s.qty;
    overlay.innerHTML = `
      <div class="sheet">
        <h3>Return: ${escapeHtml(s.name)}</h3>
        ${showStepper ? `
        <div class="qtyrow">
          <button class="qtybtn" id="rqMinus">–</button>
          <div class="qtyval">${qty}</div>
          <button class="qtybtn" id="rqPlus">+</button>
        </div>` : `<p style="color:var(--smoke-dim);font-size:13px;margin:16px 0;">This will fully reverse this sale.</p>`}
        <div class="sheetline"><span>Revenue reversed</span><b>-${ksh(revenue)}</b></div>
        <div class="sheetline"><span>Cost reversed</span><b>-${ksh(cost)}</b></div>
        <div class="sheetline"><span>Profit impact</span><b style="color:var(--cost)">-${ksh(revenue-cost)}</b></div>
        <div class="sheetbtns">
          <button class="btn-cancel" id="rCancel">Cancel</button>
          <button class="btn-confirm" id="rConfirm">Confirm return</button>
        </div>
      </div>`;
    if(showStepper){
      document.getElementById('rqMinus').onclick = ()=>{ if(returnState.qty>1){ returnState.qty--; renderReturnSheet(); } };
      document.getElementById('rqPlus').onclick = ()=>{ if(returnState.qty<returnState.maxQty){ returnState.qty++; renderReturnSheet(); } };
    }
    document.getElementById('rCancel').onclick = closeReturnSheet;
    document.getElementById('rConfirm').onclick = confirmReturn;
  }
  function closeReturnSheet(){ const overlay = document.getElementById('overlay'); if(overlay) overlay.remove(); returnState = null; }
  async function confirmReturn(){
    const s = day.sales[returnState.saleIdx];
    const qty = returnState.qty;
    const unitRevenue = s.qty ? s.revenue/s.qty : s.revenue;
    const unitCost = s.qty ? s.cost/s.qty : s.cost;
    day.sales.push({
      name: s.name, qty: s.qty ? -qty : null,
      revenue: -(unitRevenue*qty), cost: -(unitCost*qty),
      time: nowTime()
    });
    if(s.qty){ s.returnedQty = (s.returnedQty||0) + qty; }
    else { s.returned = true; }
    await saveDay(currentDate); closeReturnSheet(); render();
  }

  function openManage(){
    let overlay = document.createElement('div');
    overlay.className = 'overlay'; overlay.id = 'manageOverlay';
    const rowsHtml = products.map((p,i)=>`
      <div class="manage-field" data-i="${i}">
        <input class="m-name" value="${escapeHtml(p.name)}" />
        <input class="m-buy" inputmode="numeric" value="${p.buy}" />
        <input class="m-sell" inputmode="numeric" value="${p.sell}" />
        <button class="m-del">✕</button>
      </div>`).join('');
    overlay.innerHTML = `
      <div class="sheet">
        <h3>Products &amp; prices</h3>
        <div class="fieldlabels"><span>Name</span><span>Buy (Ksh)</span><span>Sell (Ksh)</span><span></span></div>
        <div id="manageRows">${rowsHtml}</div>
        <button class="manage-link" id="addProdBtn" style="margin-top:6px;">+ Add product</button>
        <div class="sheetbtns">
          <button class="btn-cancel" id="mCancel">Cancel</button>
          <button class="btn-confirm" id="mSave">Save</button>
        </div>
      </div>`;
    document.body.appendChild(overlay);
    overlay.addEventListener('click', (e)=>{ if(e.target===overlay) overlay.remove(); });
    overlay.querySelector('#addProdBtn').addEventListener('click', ()=>{
      const rows = overlay.querySelector('#manageRows');
      const div = document.createElement('div');
      div.className = 'manage-field';
      div.innerHTML = `<input class="m-name" value="" placeholder="New item" /><input class="m-buy" inputmode="numeric" value="0" /><input class="m-sell" inputmode="numeric" value="0" /><button class="m-del">✕</button>`;
      rows.appendChild(div);
      div.querySelector('.m-del').addEventListener('click', ()=> div.remove());
    });
    overlay.querySelectorAll('.m-del').forEach(b=>{ b.addEventListener('click', (e)=> e.target.closest('.manage-field').remove()); });
    overlay.querySelector('#mCancel').addEventListener('click', ()=> overlay.remove());
    overlay.querySelector('#mSave').addEventListener('click', async ()=>{
      const rows = overlay.querySelectorAll('.manage-field');
      const newProducts = [];
      rows.forEach(r=>{
        const name = r.querySelector('.m-name').value.trim();
        const buy = parseFloat(r.querySelector('.m-buy').value)||0;
        const sell = parseFloat(r.querySelector('.m-sell').value)||0;
        if(name) newProducts.push({name, buy, sell});
      });
      products = newProducts;
      await saveProducts();
      overlay.remove();
      render();
    });
  }

  function aggregateByProduct(sales){
    const map = {};
    sales.forEach(s=>{
      if(!map[s.name]) map[s.name] = { qty:0, hasQty:false, revenue:0, cost:0 };
      if(s.qty){ map[s.name].qty += s.qty; map[s.name].hasQty = true; }
      map[s.name].revenue += s.revenue;
      map[s.name].cost += s.cost;
    });
    return Object.entries(map)
      .map(([name,v])=>({ name, qty:v.qty, hasQty:v.hasQty, revenue:v.revenue, cost:v.cost }))
      .sort((a,b)=> b.revenue - a.revenue);
  }
  function aggregateByCategory(expenses){
    const map = {};
    expenses.forEach(x=>{ const c = x.category||'Other'; map[c] = (map[c]||0) + x.amount; });
    return Object.entries(map).sort((a,b)=>b[1]-a[1]);
  }

  const expandedDates = new Set();

  async function renderHistoryTab(){
    const all = await loadAllDays();
    const el = document.getElementById('histBody');
    if(!el) return;
    if(all.length===0){ el.innerHTML = `<div class="empty">No days logged yet.</div>`; return; }
    // running balance from oldest to newest
    const chron = all.slice().sort((a,b)=> a.date < b.date ? -1 : 1);
    let balance = 0;
    const balByDate = {};
    chron.forEach(d=>{ const t = totals(d.data); balance += t.profit; balByDate[d.date] = balance; });

    el.innerHTML = all.map(d=>{
      const t = totals(d.data);
      const profitColor = t.profit >= 0 ? 'var(--profit)' : 'var(--cost)';
      const isOpen = expandedDates.has(d.date);
      const items = aggregateByProduct(d.data.sales);
      const cats = aggregateByCategory(d.data.expenses);
      const itemRows = items.map(it=>{
        const qtyLabel = it.hasQty ? ` × ${it.qty}` : '';
        const color = it.revenue < 0 ? 'var(--cost)' : 'var(--smoke)';
        return `<div class="dbrow"><span class="dbname">${escapeHtml(it.name)}${qtyLabel}</span><span class="dbval" style="color:${color}">${ksh(it.revenue)}</span></div>`;
      }).join('') || `<div class="empty">No sales that day.</div>`;
      const catRows = cats.map(([cat,amt])=>
        `<div class="dbrow"><span class="dbname">${escapeHtml(cat)}</span><span class="dbval" style="color:var(--cost)">${ksh(amt)}</span></div>`
      ).join('') || `<div class="empty">No expenses that day.</div>`;

      return `
      <div class="histrow" data-date="${d.date}">
        <div class="hd-top">
          <div class="hd-date">${fmtDateLabel(d.date)} <span style="color:var(--smoke-dim);font-weight:400;">${isOpen?'▲':'▼'}</span></div>
          <div class="hd-profit" style="color:${profitColor}">${ksh(t.profit)}</div>
        </div>
        <div class="hd-sub">
          <span>Sales ${ksh(t.revenue)}</span>
          <span>Costs ${ksh(t.cost)}</span>
          <span>Balance ${ksh(balByDate[d.date])}</span>
        </div>
        ${isOpen ? `
          <div style="margin-top:10px;border-top:1px solid var(--line);padding-top:10px;">
            <div style="font-size:11px;color:var(--smoke-dim);margin-bottom:4px;">PRODUCTS SOLD</div>
            ${itemRows}
            <div style="font-size:11px;color:var(--smoke-dim);margin:10px 0 4px;">EXPENSES</div>
            ${catRows}
            ${d.data.note ? `<div class="hd-note">${escapeHtml(d.data.note)}</div>` : ''}
          </div>` : ''}
      </div>`;
    }).join('');

    el.querySelectorAll('.histrow').forEach(row=>{
      row.addEventListener('click', ()=>{
        const date = row.dataset.date;
        if(expandedDates.has(date)) expandedDates.delete(date); else expandedDates.add(date);
        renderHistoryTab();
      });
    });
  }

  async function renderDashboardTab(){
    const all = await loadAllDays();
    const el = document.getElementById('dbBody');
    if(!el) return;
    if(all.length===0){ el.innerHTML = `<div class="empty">No data yet — log a sale to see your dashboard.</div>`; return; }

    let allRevenue=0, allCost=0;
    const byItem = {}; // name -> revenue
    const byCat = {};  // category -> amount
    const byMonth = {}; // "YYYY-MM" -> {revenue,cost}

    all.forEach(d=>{
      const t = totals(d.data);
      allRevenue += t.revenue; allCost += t.cost;
      const mKey = d.date.slice(0,7);
      if(!byMonth[mKey]) byMonth[mKey] = {revenue:0, cost:0};
      byMonth[mKey].revenue += t.revenue; byMonth[mKey].cost += t.cost;
      d.data.sales.forEach(s=>{ byItem[s.name] = (byItem[s.name]||0) + s.revenue; });
      d.data.expenses.forEach(x=>{ const c = x.category||'Other'; byCat[c] = (byCat[c]||0) + x.amount; });
    });

    const profit = allRevenue - allCost;
    const margin = allRevenue>0 ? (profit/allRevenue*100) : 0;
    const bestItem = Object.entries(byItem).sort((a,b)=>b[1]-a[1])[0];

    const itemRows = Object.entries(byItem).sort((a,b)=>b[1]-a[1])
      .map(([name,rev])=>`<div class="dbrow"><span class="dbname">${escapeHtml(name)}</span><span class="dbval">${ksh(rev)}</span></div>`).join('');
    const catRows = Object.entries(byCat).sort((a,b)=>b[1]-a[1])
      .map(([cat,amt])=>`<div class="dbrow"><span class="dbname">${escapeHtml(cat)}</span><span class="dbval" style="color:var(--cost)">${ksh(amt)}</span></div>`).join('');
    const monthKeys = Object.keys(byMonth).sort();
    const monthRows = monthKeys.map(mk=>{
      const m = byMonth[mk]; const p = m.revenue - m.cost;
      return `<div class="dbrow"><span class="dbname">${monthLabel(mk+'-01')}</span><span class="dbval" style="color:${p>=0?'var(--profit)':'var(--cost)'}">${ksh(p)}</span></div>`;
    }).join('');

    el.innerHTML = `
      <div class="bignum"><div class="val" style="color:var(--profit)">${ksh(profit)}</div><div class="label">Net profit, all time</div></div>
      <div class="stats">
        <div class="stat rev"><div class="label">Sales</div><div class="val">${ksh(allRevenue)}</div></div>
        <div class="stat cost"><div class="label">Costs</div><div class="val">${ksh(allCost)}</div></div>
        <div class="stat"><div class="label">Margin</div><div class="val">${margin.toFixed(0)}%</div></div>
      </div>
      <h2 class="section">Sales by item ${bestItem?`<span style="color:var(--profit); font-weight:400;">· best: ${escapeHtml(bestItem[0])}</span>`:''}</h2>
      <div class="rowlist">${itemRows || '<div class="empty">No sales yet.</div>'}</div>
      <h2 class="section">Expenses by category</h2>
      <div class="rowlist">${catRows || '<div class="empty">No expenses yet.</div>'}</div>
      <h2 class="section">Profit by month</h2>
      <div class="rowlist">${monthRows || '<div class="empty">Not enough data yet.</div>'}</div>
    `;
  }

  (async function init(){
    await loadProducts();
    await seedHistoryIfNeeded();
    await loadDay(currentDate);
    render();
  })();
})();
</script>

</body>
</html>
