<div id="authGate">
  <div class="box">
    <h1>The Marinade <span>Spot</span></h1>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyCQAEp3oOoBeYH7psSBRJl_GOsfGspEnSU",
    authDomain: "marinade-spot.firebaseapp.com",
    projectId: "marinade-spot",
    storageBucket: "marinade-spot.firebasestorage.app",
    messagingSenderId: "393711325795",
    appId: "1:393711325795:web:ce9dac82c4ecdfcdd9de56"
  };
  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db = firebase.firestore();

  // ---- Firestore-backed storage shim ----
  // Mimics the same get/set/list/delete interface the app already uses,
  // but reads/writes to a shared Firestore collection instead of
  // per-device storage — this is what makes data sync between you and
  // your salesperson, on any device, in real time.
  const COLLECTION = 'appdata';
  window.storage = {
    async get(key, shared){
      const snap = await db.collection(COLLECTION).doc(key).get();
      if(!snap.exists) throw new Error('Key not found: ' + key);
      return { key, value: snap.data().value, shared: !!shared };
    },
    async set(key, value, shared){
      await db.collection(COLLECTION).doc(key).set({ value });
      return { key, value, shared: !!shared };
    },
    async delete(key, shared){
      await db.collection(COLLECTION).doc(key).delete();
      return { key, deleted: true, shared: !!shared };
    },
    async list(prefix, shared){
      let q = db.collection(COLLECTION).orderBy(firebase.firestore.FieldPath.documentId());
      if(prefix){ q = q.startAt(prefix).endAt(prefix + '\uf8ff'); }
      const snap = await q.get();
      const keys = [];
      snap.forEach(doc => keys.push(doc.id));
      return { keys, prefix, shared: !!shared };
    }
  };

  window.__DEFER_APP_START__ = true;
  let appStarted = false;

  const authGate = document.getElementById('authGate');
  const appDiv = document.getElementById('app');
  const signOutBar = document.getElementById('signOutBar');
  const whoAmI = document.getElementById('whoAmI');

  auth.onAuthStateChanged((user)=>{
    if(user){
      authGate.style.display = 'none';
      appDiv.style.display = '';
      signOutBar.style.display = 'flex';
      whoAmI.textContent = user.email;
      if(!appStarted){ appStarted = true; window.__startMarinadeApp(); }
    } else {
      authGate.style.display = 'flex';
      appDiv.style.display = 'none';
      signOutBar.style.display = 'none';
    }
  });

  document.getElementById('loginBtn').addEventListener('click', ()=>{
    const email = document.getElementById('loginEmail').value.trim();
    const pass = document.getElementById('loginPass').value;
    const errEl = document.getElementById('loginErr');
    errEl.textContent = '';
    if(!email || !pass){ errEl.textContent = 'Enter your email and password.'; return; }
    auth.signInWithEmailAndPassword(email, pass).catch((e)=>{
      errEl.textContent = e.message.replace('Firebase: ','').replace(/\(auth\/.*\)\.?/,'');
    });
  });
  document.getElementById('loginPass').addEventListener('keydown', (e)=>{
    if(e.key === 'Enter') document.getElementById('loginBtn').click();
  });

  document.getElementById('forgotBtn').addEventListener('click', ()=>{
    const email = document.getElementById('loginEmail').value.trim();
    const errEl = document.getElementById('loginErr');
    if(!email){ errEl.textContent = 'Enter your email above first, then tap this again.'; return; }
    auth.sendPasswordResetEmail(email)
      .then(()=>{ errEl.style.color = '#7FA35C'; errEl.textContent = 'Reset link sent — check your email.'; })
      .catch((e)=>{ errEl.style.color = '#A85C4A'; errEl.textContent = e.message.replace('Firebase: ',''); });
  });

  document.getElementById('signOutBtn').addEventListener('click', ()=> auth.signOut());
</script>

<script>
(function(){
  const DEFAULT_PRODUCTS = [
    { name:"Kuku", buy:500, sell:850 },
    { name:"Smokie", buy:25.45, sell:40 },
    { name:"Eggs", buy:15, sell:30 }
  ];
  const EXP_CATEGORIES = ["Stock","Transport","Personal","Other"];
  const STOCK_ITEM_SUGGESTIONS = ["Kuku (chicken)","Smokies","Eggs","Charcoal","Tomatoes","Onions","Coriander","Ghee/Cooking oil","Spices","Bread","Water","Firewood","Gas","Packaging"];

  // Historical rows recovered from the user's spreadsheet (Daily Log tab)
  const HISTORY_SEED = [
    { date:"2026-07-16", kuku:400, smokie:800, eggs:0, stock:0, transport:150, personal:0, other:50,
      note:"Kuku 4pcs@100, Smokie 20pcs@40 (2 remained). Fare 150, Token 50" },
    { date:"2026-08-17", kuku:1370, smokie:880, eggs:0, stock:0, transport:100, personal:345, other:0,
      note:"Kuku 10+4pcs@100, Smokie 1kg@40. Transport 100, Breakfast 95, Kofi 250" },
    { date:"2026-08-18", kuku:1000, smokie:1280, eggs:0, stock:1800, transport:0, personal:0, other:0,
      stockItems:{ "Kuku (chicken)":600, "Smokies":880, "Charcoal":100, "Tomatoes":100, "Onions":80, "Coriander":40 },
      note:"Kuku 11pcs, Smokie 32pcs. Restock: Kuku600, Smokie880, Makaa100, Nyanya100, Kitungu80, Dania40" },
    { date:"2026-08-19", kuku:2000, smokie:880, eggs:0, stock:0, transport:250, personal:0, other:0,
      note:"Kuku 21pcs@100, Smokie 22pcs@40. Fare 150, Fare(kuku) 100" },
    { date:"2026-08-22", kuku:1350, smokie:680, eggs:300, stock:700, transport:70, personal:60, other:0,
      stockItems:{ "Charcoal":100, "Ghee/Cooking oil":600 },
      note:"Kuku 1.5 chickens, Smokie 17pcs, Mayai 10pcs. Restock: Makaa100, Shee(ghee)600. Fare 70, Mkate 60" },
    { date:"2026-08-23", kuku:300, smokie:0, eggs:360, stock:965, transport:300, personal:85, other:50,
      stockItems:{ "Kuku (chicken)":600, "Eggs":225, "Charcoal":100, "Tomatoes":40 },
      note:"Kuku 3pcs@100, Mayai 12pcs@30. Restock: Kuku600, Mayai15pcs@15=225, Makaa100, Nyanya40. Fare 300, Mkate 85, K.j 50" },
    { date:"2026-08-28", kuku:550, smokie:280, eggs:225, stock:1320, transport:200, personal:0, other:0,
      stockItems:{ "Charcoal":100, "Tomatoes":40, "Coriander":20, "Ghee/Cooking oil":1000, "Spices":160 },
      note:"Smokie 0.5kg=280, Mayai 15pcs=225, Kuku=550. Restock: Makaa100, Nyanya40, Dania20, Shee1000, Spices160. Fare 200" },
    { date:"2026-08-29", kuku:600, smokie:260, eggs:225, stock:1270, transport:200, personal:0, other:0,
      stockItems:{ "Charcoal":100, "Tomatoes":40, "Coriander":20, "Ghee/Cooking oil":950, "Spices":160 },
      note:"Smokie 0.5kg=260, Mayai 15pcs=225, Kuku=600. Restock: Makaa100, Nyanya40, Dania20, Shee950, Spices160. Fare 200" },
    { date:"2026-08-30", kuku:600, smokie:260, eggs:225, stock:710, transport:150, personal:65, other:60,
      stockItems:{ "Stock & spices (combined)":650, "Eggs":60 },
      note:"Smokie 0.5kg=260, Mayai 15pcs=225, Kuku=600. Restock: combined stock/spices 650, extra Mayai restock 60. Fare 150, Maji 60, Mkate 65" }
  ];
  const MARGIN_PCT = { Kuku:0.4, Smokie:0.325, Eggs:0.5 };

  let products = [];
  let day = { sales:[], expenses:[] };
  let currentDate = todayStr();
  let sheetState = null;
  let activeTab = 'log';

  function todayStr(){
    const d = new Date();
    return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
  }
  function fmtDateLabel(str){
    const [y,m,d] = str.split("-").map(Number);
    const dt = new Date(y, m-1, d);
    const isToday = str === todayStr();
    const label = dt.toLocaleDateString(undefined,{weekday:'short', month:'short', day:'numeric', year:'numeric'});
    return isToday ? "Today · "+label : label;
  }
  function monthLabel(str){
    const [y,m] = str.split("-").map(Number);
    return new Date(y, m-1, 1).toLocaleDateString(undefined,{month:'short', year:'numeric'});
  }
  function ksh(n){ return "Ksh " + Math.round(n).toLocaleString(); }
  function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function nowTime(){ return new Date().toLocaleTimeString(undefined,{hour:'2-digit',minute:'2-digit'}); }

  function showBanner(msg){
    let b = document.getElementById('errBanner');
    if(!b){
      b = document.createElement('div');
      b.id = 'errBanner';
      b.style.cssText = 'position:fixed;left:14px;right:14px;bottom:14px;max-width:492px;margin:0 auto;background:#5A2E22;color:#F2E9DA;border:1px solid #A85C4A;border-radius:10px;padding:10px 14px;font-size:12.5px;font-family:Inter,sans-serif;z-index:50;text-align:center;';
      document.body.appendChild(b);
    }
    b.textContent = msg;
    clearTimeout(b._t);
    b._t = setTimeout(()=>{ if(b) b.remove(); }, 3500);
  }

  // Retries a storage call a couple of times before giving up — the backend
  // occasionally hiccups with a transient bad response.
  // Single attempt, no retry loop — retrying storage calls can itself trip
  // a "message rate limit" on the backend, which is worse than one clean failure.
  async function withRetry(fn){
    return await fn();
  }

  async function loadProducts(){
    try{
      const r = await withRetry(()=> window.storage.get('products', false));
      products = r ? JSON.parse(r.value) : DEFAULT_PRODUCTS.slice();
      // One-time price refresh: if stored prices still match the old Kuku
      // defaults (600/1000), the user's new prices haven't been applied yet.
      const kuku = products.find(p=>p.name==="Kuku");
      if(kuku && kuku.buy===600 && kuku.sell===1000){
        products = DEFAULT_PRODUCTS.slice();
        try{ await withRetry(()=> window.storage.set('products', JSON.stringify(products), false)); }catch(e3){}
      }
    }catch(e){
      products = DEFAULT_PRODUCTS.slice();
      try{ await withRetry(()=> window.storage.set('products', JSON.stringify(products), false)); }
      catch(e2){ /* first-run seed failed — in-memory defaults still work for this session */ }
    }
  }
  async function saveProducts(){
    try{ await withRetry(()=> window.storage.set('products', JSON.stringify(products), false)); }
    catch(e){ console.error('save products failed', e); showBanner("Couldn't save products — check your connection and try again."); }
  }
  async function loadDay(dateStr){
    try{
      const r = await withRetry(()=> window.storage.get('day:'+dateStr, false));
      day = r ? JSON.parse(r.value) : { sales:[], expenses:[] };
    }catch(e){ day = { sales:[], expenses:[] }; }
  }
  async function saveDay(dateStr){
    try{ await withRetry(()=> window.storage.set('day:'+dateStr, JSON.stringify(day), false)); allDaysCache = null; }
    catch(e){ console.error('save day failed', e); showBanner("Couldn't save — check your connection and try again."); }
  }
  async function getAllDayKeys(){
    try{
      const r = await withRetry(()=> window.storage.list('day:', false));
      return r ? r.keys : [];
    }catch(e){ return []; }
  }
  let allDaysCache = null;
  async function loadAllDays(forceRefresh){
    if(allDaysCache && !forceRefresh) return allDaysCache;
    const keys = await getAllDayKeys();
    const out = [];
    for(const k of keys){
      try{
        const r = await window.storage.get(k, false);
        if(r) out.push({ date: k.replace('day:',''), data: JSON.parse(r.value) });
      }catch(e){}
    }
    out.sort((a,b)=> a.date < b.date ? 1 : -1);
    allDaysCache = out;
    return out;
  }

  async function seedHistoryIfNeeded(){
    try{
      const flag = await withRetry(()=> window.storage.get('importedHistorySeed', false));
      if(flag) return;
    }catch(e){ /* not set yet, proceed */ }
    for(const row of HISTORY_SEED){
      let existing = null;
      try{ const r = await window.storage.get('day:'+row.date, false); existing = r ? JSON.parse(r.value) : null; }catch(e){}
      if(existing) continue; // don't clobber a day the user already logged
      const sales = [];
      if(row.kuku)   sales.push({ name:"Kuku",   qty:null, revenue:row.kuku,   cost:Math.round(row.kuku*(1-MARGIN_PCT.Kuku)),   time:"", imported:true });
      if(row.smokie) sales.push({ name:"Smokie", qty:null, revenue:row.smokie, cost:Math.round(row.smokie*(1-MARGIN_PCT.Smokie)), time:"", imported:true });
      if(row.eggs)   sales.push({ name:"Eggs",   qty:null, revenue:row.eggs,   cost:Math.round(row.eggs*(1-MARGIN_PCT.Eggs)),   time:"", imported:true });
      const expenses = [];
      if(row.stockItems){
        Object.entries(row.stockItems).forEach(([label, amt])=>{
          expenses.push({ desc:label, category:"Stock", item:label, amount:amt, time:"" });
        });
      } else if(row.stock){
        expenses.push({ desc:"Stock", category:"Stock", amount:row.stock, time:"" });
      }
      if(row.transport) expenses.push({ desc:"Transport", category:"Transport", amount:row.transport, time:"" });
      if(row.personal)  expenses.push({ desc:"Personal",  category:"Personal",  amount:row.personal,  time:"" });
      if(row.other)     expenses.push({ desc:"Other",     category:"Other",     amount:row.other,     time:"" });
      const dayObj = { sales, expenses, note: row.note };
      try{ await window.storage.set('day:'+row.date, JSON.stringify(dayObj), false); }catch(e){}
    }
    try{ await window.storage.set('importedHistorySeed', 'true', false); }catch(e){}
  }

  function totals(d){
    const revenue = d.sales.reduce((s,x)=>s+x.revenue,0);
    const cost = d.sales.reduce((s,x)=>s+x.cost,0) + d.expenses.reduce((s,x)=>s+x.amount,0);
    const profit = revenue - cost;
    return { revenue, cost, profit };
  }

  function openReturnSheet(saleIdx){
    const s = day.sales[saleIdx];

  function renderReturnSheet(){
    const s = day.sales[returnState.saleIdx];
    const qty = returnState.qty;
    const unitRevenue = s.qty ? s.revenue/s.qty : s.revenue;
    const unitCost = s.qty ? s.cost/s.qty : s.cost;
    const revenue = unitRevenue*qty, cost = unitCost*qty;
    let overlay = document.getElementById('overlay');
    if(!overlay){
      overlay = document.createElement('div');
      overlay.id = 'overlay'; overlay.className = 'overlay';
      document.body.appendChild(overlay);
      overlay.addEventListener('click', (e)=>{ if(e.target===overlay) closeReturnSheet(); });
    }
    const showStepper = !!s.qty;
    overlay.innerHTML = `

        <div class="qtyrow">

    if(showStepper){
      document.getElementById('rqMinus').onclick = ()=>{ if(returnState.qty>1){ returnState.qty--; renderReturnSheet(); } };
      document.getElementById('rqPlus').onclick = ()=>{ if(returnState.qty<returnState.maxQty){ returnState.qty++; renderReturnSheet(); } };
    }
    document.getElementById('rCancel').onclick = closeReturnSheet;
    document.getElementById('rConfirm').onclick = confirmReturn;
  }
  function closeReturnSheet(){ const overlay = document.getElementById('overlay'); if(overlay) overlay.remove(); returnState = null; }
  async function confirmReturn(){
    const s = day.sales[returnState.saleIdx];
    const qty = returnState.qty;
    const unitRevenue = s.qty ? s.revenue/s.qty : s.revenue;
    const unitCost = s.qty ? s.cost/s.qty : s.cost;
    day.sales.push({
      name: s.name, qty: s.qty ? -qty : null,
      revenue: -(unitRevenue*qty), cost: -(unitCost*qty),
      time: nowTime()

    else { s.returned = true; }

  function aggregateByProduct(sales){
    const map = {};
    sales.forEach(s=>{
      if(!map[s.name]) map[s.name] = { qty:0, hasQty:false, revenue:0, cost:0 };
      if(s.qty){ map[s.name].qty += s.qty; map[s.name].hasQty = true; }
      map[s.name].revenue += s.revenue;
      map[s.name].cost += s.cost;
    });
    return Object.entries(map)
      .map(([name,v])=>({ name, qty:v.qty, hasQty:v.hasQty, revenue:v.revenue, cost:v.cost }))
      .sort((a,b)=> b.revenue - a.revenue);
  }
  function aggregateByCategory(expenses){
    const map = {};
    expenses.forEach(x=>{ const c = x.category||'Other'; map[c] = (map[c]||0) + x.amount; });
    return Object.entries(map).sort((a,b)=>b[1]-a[1]);
  }
  function aggregateStockItems(expenses){
    const map = {};
    expenses.filter(x=>(x.category||'Other')==='Stock').forEach(x=>{
      const label = x.item || x.desc || 'Unspecified stock';
      map[label] = (map[label]||0) + x.amount;
    });
    return Object.entries(map).sort((a,b)=>b[1]-a[1]);
  }

  const expandedDates = new Set();

  async function renderHistoryTab(){
    const all = await loadAllDays();
    const el = document.getElementById('histBody');
    if(!el) return;
    if(all.length===0){ el.innerHTML = `<div class="empty">No days logged yet.</div>`; return; }
    // running balance from oldest to newest
    const chron = all.slice().sort((a,b)=> a.date < b.date ? -1 : 1);
    let balance = 0;
    const balByDate = {};
    chron.forEach(d=>{ const t = totals(d.data); balance += t.profit; balByDate[d.date] = balance; });

    el.innerHTML = all.map(d=>{
      const t = totals(d.data);
      const profitColor = t.profit >= 0 ? 'var(--profit)' : 'var(--cost)';
      const isOpen = expandedDates.has(d.date);
      const items = aggregateByProduct(d.data.sales);
      const cats = aggregateByCategory(d.data.expenses);
      const itemRows = items.map(it=>{
        const qtyLabel = it.hasQty ? ` × ${it.qty}` : '';
        const color = it.revenue < 0 ? 'var(--cost)' : 'var(--smoke)';
        return `<div class="dbrow"><span class="dbname">${escapeHtml(it.name)}${qtyLabel}</span><span class="dbval" style="color:${color}">${ksh(it.revenue)}</span></div>`;
      }).join('') || `<div class="empty">No sales that day.</div>`;
      const catRows = cats.map(([cat,amt])=>{
        const row = `<div class="dbrow"><span class="dbname">${escapeHtml(cat)}</span><span class="dbval" style="color:var(--cost)">${ksh(amt)}</span></div>`;
        if(cat==='Stock'){
          const stockItems = aggregateStockItems(d.data.expenses);
          const nested = stockItems.map(([label,a])=>
            `<div class="dbrow" style="padding-left:14px;font-size:12px;"><span class="dbname" style="color:var(--smoke-dim);">↳ ${escapeHtml(label)}</span><span class="dbval" style="color:var(--cost);font-weight:600;">${ksh(a)}</span></div>`
          ).join('');
          return row + nested;
        }
        return row;
      }).join('') || `<div class="empty">No expenses that day.</div>`;

      return `
      <div class="histrow" data-date="${d.date}">
        <div class="hd-top">
          <div class="hd-date">${fmtDateLabel(d.date)} <span style="color:var(--smoke-dim);font-weight:400;">${isOpen?'▲':'▼'}</span></div>
          <div class="hd-profit" style="color:${profitColor}">${ksh(t.profit)}</div>
        </div>
        <div class="hd-sub">
          <span>Sales ${ksh(t.revenue)}</span>
          <span>Costs ${ksh(t.cost)}</span>
          <span>Balance ${ksh(balByDate[d.date])}</span>
        </div>
        ${isOpen ? `
          <div style="margin-top:10px;border-top:1px solid var(--line);padding-top:10px;">
            <div style="font-size:11px;color:var(--smoke-dim);margin-bottom:4px;">PRODUCTS SOLD</div>
            ${itemRows}
            <div style="font-size:11px;color:var(--smoke-dim);margin:10px 0 4px;">EXPENSES</div>
            ${catRows}
            ${d.data.note ? `<div class="hd-note">${escapeHtml(d.data.note)}</div>` : ''}
          </div>` : ''}
      </div>`;
    }).join('');

    el.querySelectorAll('.histrow').forEach(row=>{
      row.addEventListener('click', ()=>{
        const date = row.dataset.date;
        if(expandedDates.has(date)) expandedDates.delete(date); else expandedDates.add(date);
        renderHistoryTab();
      });
    });
  }

  function loadScript(src){
    return new Promise((resolve, reject)=>{
      if(document.querySelector(`script[src="${src}"]`)){ resolve(); return; }
      const s = document.createElement('script');
      s.src = src;
      s.onload = ()=> resolve();
      s.onerror = ()=> reject(new Error('Failed to load '+src));
      document.head.appendChild(s);
    });
  }

  const BACKUP_HTML = `
    <h2 class="section">Backup &amp; reports</h2>
    <div class="addbar" style="margin-top:0;">
      <button id="exportBtn" style="flex:1;">Full backup (.json)</button>
      <button id="importBtn" style="flex:1;background:var(--panel2);color:var(--smoke);border:1px solid var(--line);">Import backup</button>
    </div>
    <input type="file" id="importFile" accept="application/json" style="display:none;">
    <div class="addbar">
      <button id="exportExcelBtn" style="flex:1;">Export Excel</button>
      <button id="exportPdfBtn" style="flex:1;">Export PDF</button>
    </div>
  `;

  async function exportBackup(){
    const keys = await getAllDayKeys();
    const days = {};
    for(const k of keys){
      try{ const r = await window.storage.get(k, false); if(r) days[k.replace('day:','')] = JSON.parse(r.value); }catch(e){}
    }
    const payload = { exportedAt: new Date().toISOString(), products, days };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type:'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'marinade-spot-backup-' + todayStr() + '.json';
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  }

  async function importBackupFile(file){
    try{
      const text = await file.text();
      const payload = JSON.parse(text);
      if(payload.products){
        products = payload.products;
        await saveProducts();
      }
      if(payload.days){
        for(const [date, data] of Object.entries(payload.days)){
          await withRetry(()=> window.storage.set('day:'+date, JSON.stringify(data), false));
        }
      }
      allDaysCache = null;
      showBanner("Backup imported successfully.");
      render();
    }catch(e){
      console.error('import failed', e);
      showBanner("Couldn't read that backup file.");
    }
  }

  async function exportExcel(){
    showBanner("Preparing Excel file…");
    try{ await loadScript('https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js'); }
    catch(e){ showBanner("Couldn't load the Excel exporter — check your connection."); return; }

    const all = (await loadAllDays(true)).slice().sort((a,b)=> a.date < b.date ? -1 : 1);
    let balance = 0;
    const summaryRows = [["Date","Revenue","Cost","Profit","Balance"]];
    const salesRows = [["Date","Item","Qty","Revenue","Cost"]];
    const expenseRows = [["Date","Description","Category","Amount"]];

    all.forEach(d=>{
      const t = totals(d.data);
      balance += t.profit;
      summaryRows.push([d.date, t.revenue, t.cost, t.profit, balance]);
      d.data.sales.forEach(s=>{
        salesRows.push([d.date, s.name, s.qty!=null ? s.qty : '', s.revenue, s.cost]);
      });
      d.data.expenses.forEach(x=>{
        expenseRows.push([d.date, x.desc, x.category||'Other', x.amount]);
      });
    });

    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(summaryRows), "Daily Summary");
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(salesRows), "Sales Detail");
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(expenseRows), "Expenses");
    XLSX.writeFile(wb, 'marinade-spot-report-' + todayStr() + '.xlsx');
  }

  async function exportPdf(){
    showBanner("Preparing PDF…");
    try{ await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js'); }
    catch(e){ showBanner("Couldn't load the PDF exporter — check your connection."); return; }

    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();
    const all = (await loadAllDays(true)).slice().sort((a,b)=> a.date < b.date ? -1 : 1);
    let y = 18;
    doc.setFontSize(16);
    doc.text("The Marinade Spot — Sales Report", 14, y);
    doc.setFontSize(9);
    doc.setTextColor(120);
    y += 6;
    doc.text("Generated " + new Date().toLocaleDateString(), 14, y);
    doc.setTextColor(0);
    y += 10;

    function ensureRoom(lines){
      if(y + lines*5 > 285){ doc.addPage(); y = 18; }
    }

    all.forEach(d=>{
      const t = totals(d.data);
      ensureRoom(4);
      doc.setFontSize(11);
      doc.setFont(undefined, 'bold');
      doc.text(fmtDateLabel(d.date), 14, y);
      doc.setFont(undefined, 'normal');
      doc.setFontSize(9);
      doc.text(`Revenue ${ksh(t.revenue)}   Cost ${ksh(t.cost)}   Profit ${ksh(t.profit)}`, 14, y+5);
      y += 11;

      const items = aggregateByProduct(d.data.sales);
      items.forEach(it=>{
        ensureRoom(1);
        const qtyLabel = it.hasQty ? ` x${it.qty}` : '';
        doc.text(`   ${it.name}${qtyLabel} — ${ksh(it.revenue)}`, 14, y);
        y += 5;
      });
      const cats = aggregateByCategory(d.data.expenses);
      cats.forEach(([cat,amt])=>{
        ensureRoom(1);
        doc.text(`   Expense (${cat}) — ${ksh(amt)}`, 14, y);
        y += 5;
      });
      y += 3;
    });

    doc.save('marinade-spot-report-' + todayStr() + '.pdf');
  }

  function wireBackupControls(){
    const exportBtn = document.getElementById('exportBtn');
    const importBtn = document.getElementById('importBtn');
    const importFile = document.getElementById('importFile');
    const exportExcelBtn = document.getElementById('exportExcelBtn');
    const exportPdfBtn = document.getElementById('exportPdfBtn');
    if(exportBtn) exportBtn.addEventListener('click', exportBackup);
    if(importBtn) importBtn.addEventListener('click', ()=> importFile.click());
    if(importFile) importFile.addEventListener('change', (e)=>{
      const f = e.target.files[0];
      if(f) importBackupFile(f);
    });
    if(exportExcelBtn) exportExcelBtn.addEventListener('click', exportExcel);
    if(exportPdfBtn) exportPdfBtn.addEventListener('click', exportPdf);
  }

  async function renderDashboardTab(){
    const all = await loadAllDays();
    const el = document.getElementById('dbBody');
    if(!el) return;
    if(all.length===0){
      el.innerHTML = `<div class="empty">No data yet — log a sale to see your dashboard.</div>${BACKUP_HTML}`;
      wireBackupControls();
      return;
    }

    let allRevenue=0, allCost=0;
    const byItem = {}; // name -> revenue
    const byCat = {};  // category -> amount
    const byStockItem = {}; // stock item label -> amount
    const byMonth = {}; // "YYYY-MM" -> {revenue,cost}

    all.forEach(d=>{
      const t = totals(d.data);
      allRevenue += t.revenue; allCost += t.cost;
      const mKey = d.date.slice(0,7);
      if(!byMonth[mKey]) byMonth[mKey] = {revenue:0, cost:0};
      byMonth[mKey].revenue += t.revenue; byMonth[mKey].cost += t.cost;
      d.data.sales.forEach(s=>{ byItem[s.name] = (byItem[s.name]||0) + s.revenue; });
      d.data.expenses.forEach(x=>{
        const c = x.category||'Other';
        byCat[c] = (byCat[c]||0) + x.amount;
        if(c==='Stock'){
          const label = x.item || x.desc || 'Unspecified stock';
          byStockItem[label] = (byStockItem[label]||0) + x.amount;
        }
      });
    });

    const profit = allRevenue - allCost;
    const margin = allRevenue>0 ? (profit/allRevenue*100) : 0;
    const bestItem = Object.entries(byItem).sort((a,b)=>b[1]-a[1])[0];
    const totalStock = Object.values(byStockItem).reduce((s,v)=>s+v,0);

    const itemRows = Object.entries(byItem).sort((a,b)=>b[1]-a[1])
      .map(([name,rev])=>`<div class="dbrow"><span class="dbname">${escapeHtml(name)}</span><span class="dbval">${ksh(rev)}</span></div>`).join('');
    const catRows = Object.entries(byCat).sort((a,b)=>b[1]-a[1])
      .map(([cat,amt])=>`<div class="dbrow"><span class="dbname">${escapeHtml(cat)}</span><span class="dbval" style="color:var(--cost)">${ksh(amt)}</span></div>`).join('');
    const stockRows = Object.entries(byStockItem).sort((a,b)=>b[1]-a[1])
      .map(([label,amt])=>{
        const pct = totalStock>0 ? (amt/totalStock*100) : 0;
        return `<div class="dbrow"><span class="dbname">${escapeHtml(label)}</span><span class="dbval" style="color:var(--cost)">${ksh(amt)} <span style="color:var(--smoke-dim);font-weight:400;font-size:11px;">(${pct.toFixed(0)}%)</span></span></div>`;
      }).join('');
    const topStock = Object.entries(byStockItem).sort((a,b)=>b[1]-a[1])[0];
    const monthKeys = Object.keys(byMonth).sort();
    const monthRows = monthKeys.map(mk=>{
      const m = byMonth[mk]; const p = m.revenue - m.cost;
      return `<div class="dbrow"><span class="dbname">${monthLabel(mk+'-01')}</span><span class="dbval" style="color:${p>=0?'var(--profit)':'var(--cost)'}">${ksh(p)}</span></div>`;
    }).join('');

    el.innerHTML = `
      <div class="bignum"><div class="val" style="color:var(--profit)">${ksh(profit)}</div><div class="label">Net profit, all time</div></div>
      <div class="stats">
        <div class="stat rev"><div class="label">Sales</div><div class="val">${ksh(allRevenue)}</div></div>
        <div class="stat cost"><div class="label">Costs</div><div class="val">${ksh(allCost)}</div></div>
        <div class="stat"><div class="label">Margin</div><div class="val">${margin.toFixed(0)}%</div></div>
      </div>
      <h2 class="section">Sales by item ${bestItem?`<span style="color:var(--profit); font-weight:400;">· best: ${escapeHtml(bestItem[0])}</span>`:''}</h2>
      <div class="rowlist">${itemRows || '<div class="empty">No sales yet.</div>'}</div>
      <h2 class="section">Expenses by category</h2>
      <div class="rowlist">${catRows || '<div class="empty">No expenses yet.</div>'}</div>
      <h2 class="section">Stock spending by item ${topStock?`<span style="color:var(--cost); font-weight:400;">· biggest: ${escapeHtml(topStock[0])}</span>`:''}</h2>
      <div class="rowlist">${stockRows || '<div class="empty">No stock purchases logged with an item yet.</div>'}</div>
      <h2 class="section">Profit by month</h2>
      <div class="rowlist">${monthRows || '<div class="empty">Not enough data yet.</div>'}</div>
      ${BACKUP_HTML}
    `;
    wireBackupControls();
  }

  window.__startMarinadeApp = async function(){
    await loadProducts();
    await seedHistoryIfNeeded();
    await loadDay(currentDate);
    render();
  };
  if(!window.__DEFER_APP_START__){ window.__startMarinadeApp(); }
})();
</script>
